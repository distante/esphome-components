name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ unit tests (pio native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            esphome/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -r requirements_test.txt
      - run: pio test -e native

  host:
    name: Host component tests (ESPHome host + GoogleTest)
    # Same runner ESPHome's own cpp-unit-tests job uses; its preinstalled gcc ships ASan/UBSan.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            esphome/requirements.txt
      - run: pip install -r requirements_test.txt
      - run: python tests/host/run.py

  config:
    name: Config validation (esphome config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            esphome/requirements.txt
      - run: pip install -r requirements_test.txt
      - run: pytest tests/config

  compile:
    name: Config compile (esphome compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            esphome/requirements.txt
      # ESP-IDF and the toolchains are large; key on the vendored ESPHome commit so every bump refreshes them.
      - id: esphome
        run: echo "sha=$(git rev-parse HEAD:esphome)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-esp32-${{ runner.os }}-${{ steps.esphome.outputs.sha }}
      - run: pip install -r requirements_test.txt
      - run: pytest tests/config --compile -m compile

  js:
    name: Page JS tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
