<!doctype html>
<!--
  The sniffer page (.specs/sniffer.md, "Page"). The build (page_bundle.py) inlines the ./*.mjs modules it imports
  and gzips it into flash; the device serves it at GET /sniffer. catalogue.mjs is no file: page_bundle.py generates
  it from C++ headers (its docstring), so the page only runs bundled. To work on it without flashing,
  bundle it and open it with ?device=http://<device-ip> (readme.md, "Tests"): the data endpoints allow any origin.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC-Touch sniffer</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --mute:#6e6e73; --line:#ddd; --acc:#0a66c2; --bad:#c0392b; --ok:#1e8449;
    --mark:#e67e22; }
  * { box-sizing:border-box; }
  /* Beats the display of .row, .cards and the rest, so `hidden` always hides. */
  [hidden] { display:none !important; }
  /* A column the height of the window: discover's map takes what the rows above it leave. */
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:0 12px 12px;
    height:100vh; display:flex; flex-direction:column; }
  h1 { font-size:15px; margin:10px 0; }
  button, input, select, textarea { font:inherit; }
  button { padding:3px 9px; cursor:pointer; }
  code { font-family:ui-monospace, Menlo, monospace; }
  .mute { color:var(--mute); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .row .row { margin:0; }
  .grow { flex:1; }
  .badge { display:inline-block; padding:0 5px; border-radius:3px; font-size:11px; border:1px solid var(--line); background:#fff; }
  .offline { background:var(--bad); color:#fff; border-color:var(--bad); }
  .bar { height:8px; background:#e5e5e5; border-radius:4px; overflow:hidden; min-width:120px; }
  .bar > i { display:block; height:100%; background:var(--acc); }
  #discover-view { flex:1 1 0; min-height:0; display:flex; flex-direction:column; }
  /* All 256 cells fit: the grid fills the width left of the side column and the height left in the window. */
  #main { flex:1 1 0; min-height:380px; display:flex; gap:12px; }
  #grid { flex:1; min-width:0; display:grid; gap:2px;
    grid-template-columns:repeat(16, minmax(0, 1fr)); grid-template-rows:repeat(16, minmax(0, 1fr)); }
  .cell { font-size:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; background:#f7f7f7; border:1px solid #e2e2e2; }
  .cell code { font-size:10px; max-width:100%; overflow:hidden; white-space:nowrap; }
  .cell.unseen { background:#fff; border:1px dashed #bbb; }
  /* A known property: discover leaves a gap, check shows it. */
  .cell.gone { background:transparent; border:none; cursor:default; }
  /* A known property under "show known": grey, with no type or status colour, and not clickable. */
  .cell.known { background:#e4e4e4; border-color:#d2d2d2; color:#777; cursor:default; }
  .marked { box-shadow:inset 0 0 0 3px var(--mark); }
  .cell.stale { opacity:.45; font-style:italic; }
  .dim { background-image:repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.3) 4px 6px); }
  .cell.dim { opacity:.5; }
  .cell.cursor { outline:3px solid var(--acc); }
  .cell.sel { outline:2px solid red; }
  .flash { animation:flash 2s; }
  /* The chips of the group "colour by" does not use: their colour is not on the map, so it fades. */
  .faded > .badge { background-image:linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,.7)); }
  /* No `to`: the flash fades into the cell's own box-shadow, the mark's ring on a marked cell. */
  @keyframes flash { from { box-shadow:inset 0 0 0 40px #ffe58a; } }
  #side { width:340px; flex:none; overflow:auto; }
  .box { background:#fff; border:1px solid var(--line); padding:8px; margin-bottom:10px; }
  #drawer .value { font-size:20px; margin:6px 0; word-break:break-all; }
  #drawer textarea { width:100%; min-height:60px; }
  #drawer table td { padding:1px 6px 1px 0; vertical-align:top; }
  .unexpected { color:var(--bad); }
  .list { margin-bottom:10px; }
  .list div { cursor:pointer; border-bottom:1px solid var(--line); padding:2px 0; }
  .s-ok { color:var(--ok); } .s-nak { color:var(--bad); } .s-timeout { color:#b9770e; } .s-unqueried { color:#999; }
  .bigtabs { display:flex; margin:8px 0; border-bottom:2px solid var(--line); }
  .bigtabs button { flex:1; border:none; background:none; padding:8px 16px; font-size:14px;
    border-bottom:3px solid transparent; margin-bottom:-2px; text-align:left; }
  .bigtabs button.on { border-bottom-color:var(--acc); font-weight:600; }
  .bigtabs small { font-weight:400; color:var(--mute); font-size:12px; }
  #range input { width:4em; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card .big { font-size:18px; }
  .card .gap { margin-top:6px; }
  @media (max-width:900px) {
    body, #discover-view { height:auto; display:block; }
    #main { flex-direction:column; }
    #grid { grid-template-rows:none; }
    .cell { aspect-ratio:1; }
    #side { width:100%; }
  }
</style>
</head>
<body>
<div class="row">
  <h1 id="title">SEC-Touch sniffer</h1>
  <span id="online" class="badge">connecting…</span>
  <span id="device" class="mute"></span>
  <span class="grow"></span>
  <button id="export-json">Export JSON</button>
  <button id="export-csv">Export CSV</button>
</div>
<div id="goal-tabs" class="bigtabs"></div>
<div id="scan" class="row" hidden>
  <button id="scan-toggle"></button>
  <span id="range">
    IDs <input id="range-from" inputmode="numeric" aria-label="from ID">
    – <input id="range-to" inputmode="numeric" aria-label="to ID">
    <span id="range-error" class="unexpected"></span>
  </span>
  <div class="bar grow"><i id="scan-bar"></i></div>
  <span id="scan-label" class="mute"></span>
</div>
<div id="check-view" class="cards" hidden></div>
<div id="discover-view">
<div class="row">
  <input id="f-query" placeholder="ID, value or note…" style="width:170px">
  <select id="f-changed"></select>
  colour by <select id="colour-by"><option>type</option><option>status</option></select>
  <label><input id="show-known" type="checkbox"> show known</label>
  <span class="badge" style="border:1px dashed #bbb">never seen</span>
  <span class="badge dim">filtered out</span>
  <span class="badge marked">changed since mark</span>
  <span id="known-gap-legend" class="mute"></span>
</div>
<div class="row">
  <span id="f-types" class="row"></span>
  <span class="mute">│</span>
  <span id="f-statuses" class="row"></span>
</div>
<div id="main">
  <div id="grid"></div>
  <div id="side">
    <div id="mark" class="box">
      <b>Mark</b> <span class="mute">before and after a panel change</span>
      <div class="row">
        <button id="mark-set" title="Remember every value now; then change something on the panel">Set mark</button>
        <span id="mark-on" class="row" hidden>
          <label><input id="f-since-mark" type="checkbox"> only changed since mark (<span id="mark-count"></span>)</label>
          <span id="mark-at" class="mute"></span>
          <button id="mark-move">Move mark to now</button>
          <button id="mark-clear">Clear mark</button>
        </span>
      </div>
    </div>
    <div id="drawer" class="box" hidden>
      <div id="drawer-info"></div>
      <textarea id="note"></textarea>
    </div>
    <div id="mark-changes-box" hidden>
      <b>Changed since mark</b> <span class="mute">(mark value → now)</span>
      <div id="mark-changes" class="list"></div>
    </div>
    <b>Changes</b> <span class="mute">(newest first)</span>
    <div id="feed" class="list"></div>
  </div>
</div>
</div>
<script type="module">
import { applyResponse, changeFeed, emptyCopy, rowsOf, withScan } from "./records.mjs";
import { createPoller, resyncReason, sinceFor } from "./poll.mjs";
import { allPass, visibleIds } from "./filters.mjs";
import { changedSinceMark, markChanges, markNow } from "./mark.mjs";
import { scanProgress } from "./scan_progress.mjs";
import {
  acceptedRange,
  rangeError,
  scanButtonLabel,
  scanReply,
  scanStartPath,
  switchStopsScan,
} from "./scan_control.mjs";
import { checkCards } from "./check_cards.mjs";
import { exportCsv, exportJson } from "./export.mjs";
import { deviceKey, LAST_MAC_KEY, parseStored, storedText } from "./storage.mjs";
import { STATUS_COLOURS, TYPE_COLOURS } from "./colours.mjs";
import { knownCellTitle, knownIds, meaningText } from "./known_meaning.mjs";
import { shown } from "./control_bytes.mjs";
import { CATALOGUE } from "./catalogue.mjs";

const ID_COUNT = 256;
/** Known properties are fixed by the catalogue: discover's map leaves a gap for each, once, at page start. */
const KNOWN_ID_SET = new Set(knownIds(CATALOGUE));
/** What a known ID's gap or grey cell in discover's map means: the gap's tooltip and the legend. */
const KNOWN_GAP_TEXT = "known, see Check";
const FEED_LENGTH = 60;
/** A grid cell previews this many characters of its value; the full value is in its tooltip. */
const CELL_CHARS = 6;
const MINUTE_MS = 60_000;
const HOUR_MS = 60 * MINUTE_MS;
/** The "changed recently" filter's choices, as [window in ms, label]; 0 means any time. */
const CHANGED_WITHIN_PRESETS = [
  [0, "changed any time"],
  [5 * MINUTE_MS, "changed < 5 min"],
  [HOUR_MS, "changed < 1 h"],
];
/** The goals as the device names them. */
const GOALS = CATALOGUE.goals;
/** The page tabs, as [goal, title, what the goal does]. */
const GOAL_TABS = [
  [GOALS.discover, "Discover", "find unknown properties"],
  [GOALS.check, "Check", "confirm known properties"],
];
const SWITCH_STOPS_SCAN = "Switching stops the running scan";
/** The registered badge's tooltip, on check's fan cards. */
const REGISTERED_TITLE = "registered: polled by the hub for this YAML";

// Empty on the device; `?device=http://<ip>` while working on the page from a local server.
const DEVICE_URL = new URLSearchParams(location.search).get("device") ?? "";
const $ = (id) => document.getElementById(id);

/** Builds an element: `el("b", {class: "x"}, "text", child)`. */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    node.setAttribute(name, value);
  }
  node.append(...children.filter((child) => child !== null));
  return node;
}

const isPadded = (raw) => raw !== null && raw !== raw.trim();
const formatWall = (wallMs) => (wallMs === null ? "—" : new Date(wallMs).toLocaleString());

// ───── state: the browser copy, notes and mutes, kept per device MAC ─────
let mac = null;
let copy = emptyCopy();
let notes = {};
let mutes = new Set();
// The last discover range the device accepted, filled into the range inputs when a device loads.
let range = CATALOGUE.discoverRange;
// The open tab's goal. Not stored: the page always opens in discover.
let goal = GOALS.discover;
// The device's error text for the last refused discover start, null after an accepted one.
let rangeErrorText = null;
let selected = null;
// The mark (mark.mjs), null while none is set. Page memory only: never stored.
let mark = null;
let online = null;
let scanRequestFailed = false;
const filter = allPass();
let colourBy = "type";
// Whether discover's map shows known IDs greyed instead of as gaps. Page memory only: never stored.
let showKnown = false;
const flashIds = new Set();
// The ID whose note the drawer's note field holds.
let drawerFor = null;

function load(newMac) {
  mac = newMac;
  // The selection stays, but the note field must refill from the new device's notes.
  drawerFor = null;
  let text = null;
  try {
    text = localStorage.getItem(deviceKey(mac));
  } catch {
    // Blocked storage: the device starts from an empty copy.
  }
  ({ copy, notes, mutes, range } = parseStored(text, CATALOGUE.discoverRange));
  // Another device's values say nothing about this one.
  clearMark();
  // A refused range of the previous device says nothing about this one.
  rangeErrorText = null;
  fillRange();
}

function fillRange() {
  $("range-from").value = String(range.from);
  $("range-to").value = String(range.to);
}

/** The MAC of the last device that answered, so its copy shows at page open even while it is offline. */
function lastMac() {
  try {
    return localStorage.getItem(LAST_MAC_KEY);
  } catch {
    return null;
  }
}

function rememberMac() {
  try {
    localStorage.setItem(LAST_MAC_KEY, mac);
  } catch {
    // Blocked storage: the page just opens empty until the device answers.
  }
}

function save() {
  try {
    localStorage.setItem(deviceKey(mac), storedText(copy, notes, mutes, range));
  } catch {
    // Full or blocked storage: the page still works, the copy just does not survive a reload.
  }
}

// ───── device ─────
/** Fetches from the device; rejects on a network error and on a non-OK status alike. */
async function fetchOk(path, options) {
  const response = await fetch(`${DEVICE_URL}${path}`, options);
  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }
  return response;
}

async function fetchData(since) {
  const response = await fetchOk(`/sniffer/data?since=${since}`, { cache: "no-store" });
  return response.json();
}

const currentScan = () => copy.device?.scan ?? null;

async function pollOnce() {
  let response = await fetchData(sinceFor(copy));
  if (response.mac !== mac) {
    load(response.mac);
    rememberMac();
    // The stored copy's `since` is unset, so this is a resync unless the response was full already.
  }
  if (resyncReason(copy, response) !== null) {
    copy = { ...copy, since: null };
    response = await fetchData(0);
  }
  const result = applyResponse(copy, response, Date.now());
  copy = result.copy;
  for (const id of result.changedIds) {
    flashIds.add(id);
  }
  // The device answered, so a failed scan request no longer describes it.
  scanRequestFailed = false;
  save();
  renderLogged();
}

const poller = createPoller({
  poll: pollOnce,
  setTimer: (fn, ms) => setTimeout(fn, ms),
  clearTimer: (timer) => clearTimeout(timer),
  onOnline: (isOnline) => {
    online = isOnline;
    renderHeader();
  },
});

/** A reply's body; a body that breaks off reads as empty, which scanReply() takes as no scan object. */
const replyText = (response) => response.text().catch(() => "");

/**
 * Puts the scan of a start or stop reply into the copy at once, so the scan control decides on it rather than on the
 * last poll's. Dropped when another device answered while the request was out.
 *
 * @returns {object | null} the reply's scan, null when it was dropped or the body held none
 */
function takeScanReply(requestMac, bodyText) {
  const scan = scanReply(bodyText);
  if (scan === null || mac !== requestMac) {
    return null;
  }
  copy = withScan(copy, scan);
  return scan;
}

/** @returns {Promise<boolean>} whether the device accepted the stop */
async function stopScan() {
  const requestMac = mac;
  let stopped = false;
  try {
    const response = await fetchOk("/sniffer/scan/stop", { method: "POST" });
    scanRequestFailed = false;
    stopped = true;
    takeScanReply(requestMac, await replyText(response));
    poller.pollNow();
  } catch (error) {
    // No poll at once: it would clear the failure before it shows. The next scheduled poll clears it.
    console.error("scan stop request failed", error);
    scanRequestFailed = true;
  }
  renderLogged();
  return stopped;
}

/** Starts the open tab's goal; discover sends the range as typed, and the device decides whether it is valid. */
async function startScan() {
  const startGoal = goal;
  const requestMac = mac;
  const fromText = $("range-from").value;
  const toText = $("range-to").value;
  try {
    const response = await fetch(`${DEVICE_URL}${scanStartPath(CATALOGUE, startGoal, fromText, toText)}`, {
      method: "POST",
    });
    if (response.status === 400) {
      scanRequestFailed = false;
      if (mac === requestMac) {
        rangeErrorText = rangeError(await replyText(response));
      }
      renderLogged();
      return;
    }
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    scanRequestFailed = false;
    rangeErrorText = null;
    // The device accepted the start: a body the page cannot read is no failure, the poll brings the scan.
    const scan = takeScanReply(requestMac, await replyText(response));
    // A start while a scan runs replies with the running scan: only a range that was sent and runs is remembered.
    const accepted = startGoal === GOALS.discover ? acceptedRange(CATALOGUE, scan, fromText, toText) : null;
    if (accepted !== null) {
      range = accepted;
      save();
    }
    poller.pollNow();
  } catch (error) {
    // No poll at once: it would clear the failure before it shows. The next scheduled poll clears it.
    console.error("scan start request failed", error);
    scanRequestFailed = true;
  }
  renderLogged();
}

function toggleScan() {
  return currentScan()?.active ? stopScan() : startScan();
}

/**
 * Opens a goal's tab. Leaving a running scan's goal stops that scan, after asking; the page never starts one. The
 * confirm promised a stop, so a stop that fails keeps the tab, and the header shows the failure.
 */
async function setGoal(target) {
  if (target === goal) {
    return;
  }
  if (switchStopsScan(currentScan(), target)) {
    if (!confirm(SWITCH_STOPS_SCAN)) {
      return;
    }
    if (!(await stopScan())) {
      return;
    }
  }
  goal = target;
  // The range error belongs to discover's last start, not to the tab opened now.
  rangeErrorText = null;
  renderLogged();
}

// ───── rendering ─────
const cells = [];

function buildStatic() {
  for (let id = 0; id < ID_COUNT; id++) {
    // No data-id on a known ID: it is never selected.
    const cell = KNOWN_ID_SET.has(id) ? el("div", { class: "cell" }) : el("div", { class: "cell", "data-id": id });
    cells.push(cell);
    $("grid").append(cell);
  }
  addChips($("f-types"), TYPE_COLOURS, filter.types);
  addChips($("f-statuses"), STATUS_COLOURS, filter.statuses);
  $("f-changed").append(...CHANGED_WITHIN_PRESETS.map(([ms, label]) => el("option", { value: ms }, label)));
  $("goal-tabs").append(...GOAL_TABS.map(([tabGoal, title, does]) =>
    el("button", { "data-goal": tabGoal }, title, " ", el("small", {}, `— ${does}`))));
  fillRange();
}

function renderHeader() {
  const device = copy.device;
  if (device !== null) {
    $("title").textContent = `SEC-Touch sniffer · ${device.name}`;
    $("device").textContent = `${mac} · ${Object.keys(copy.records).length} IDs`;
  }
  const state = online === false ? "offline, retrying" : online ? "live" : "connecting…";
  $("online").textContent = scanRequestFailed ? `${state} · scan request failed` : state;
  $("online").classList.toggle("offline", online === false || scanRequestFailed);
}

function renderScan() {
  const scan = currentScan();
  $("scan").hidden = scan === null;
  if (scan === null) {
    return;
  }
  const progress = scanProgress(scan, CATALOGUE, goal);
  $("scan-toggle").textContent = scanButtonLabel(scan, goal);
  $("scan-bar").style.width = `${progress.percent}%`;
  $("scan-label").textContent = progress.label;
  $("range").hidden = goal !== GOALS.discover;
  $("range-error").textContent = rangeErrorText ?? "";
}

function renderTabs() {
  for (const tab of $("goal-tabs").children) {
    tab.classList.toggle("on", tab.dataset.goal === goal);
  }
  $("discover-view").hidden = goal !== GOALS.discover;
  $("check-view").hidden = goal !== GOALS.check;
}

/** A known property's meaning: red when unexpected, "not seen" while it has no value. */
function meaningView(meaning, size = "") {
  if (meaning === null) {
    return el("span", { class: `mute ${size}`.trim() }, meaningText(meaning));
  }
  const classes = `${meaning.unexpected ? "unexpected" : ""} ${size}`.trim();
  return el("span", classes ? { class: classes } : {}, meaningText(meaning));
}

const registeredBadge = () => el("span", { class: "badge", title: REGISTERED_TITLE }, "registered");

const rawView = (property) => el("span", { class: "mute" }, `${property.id} = `, el("code", {}, shown(property.raw)));

function renderCheck(rows) {
  const { fans, global } = checkCards(CATALOGUE, rows);
  const fanCards = fans.map((card) =>
    el("div", { class: "card" },
      el("h3", {}, `Fan ${card.fan} `,
        card.registered ? registeredBadge() : null),
      el("div", {}, meaningView(card.level.meaning, "big")),
      el("div", {}, rawView(card.level)),
      el("div", { class: "gap" }, "label: ", meaningView(card.label.meaning)),
      el("div", {}, rawView(card.label))));
  const globalCard = el("div", { class: "card" }, el("h3", {}, "Global"),
    ...global.map((property) =>
      el("div", {}, `${property.name}: `, meaningView(property.meaning), " (", rawView(property), ")")));
  $("check-view").replaceChildren(...fanCards, globalCard);
}

function cellColour(row) {
  // An ID with no value has no type, so it shows its status colour.
  return (colourBy === "type" && TYPE_COLOURS[row.type]) || STATUS_COLOURS[row.status];
}

function renderGrid(rowsById, visible) {
  const scan = currentScan();
  for (let id = 0; id < ID_COUNT; id++) {
    const cell = cells[id];
    const row = rowsById.get(id);
    if (KNOWN_ID_SET.has(id)) {
      renderKnownCell(cell, id, row?.raw ?? null);
      continue;
    }
    cell.replaceChildren(el("span", { class: "mute" }, String(id)));
    // backgroundColor, not background, so the filtered-out stripes of .dim stay.
    cell.style.backgroundColor = row ? cellColour(row) : "";
    cell.classList.toggle("unseen", !row);
    cell.title = row ? `${id} = ${shown(row.raw)}` : String(id);
    if (row && row.raw !== null) {
      cell.append(el("code", {}, shown(row.raw).slice(0, CELL_CHARS)));
    }
    if (row && notes[id]) {
      cell.append(el("span", {}, "✎"));
    }
    cell.classList.toggle("stale", Boolean(row?.stale));
    cell.classList.toggle("dim", Boolean(row) && !visible.has(id));
    cell.classList.toggle("marked", changedSinceMark(mark, id, row?.raw ?? null));
    cell.classList.toggle("cursor", Boolean(scan?.active) && scan.next === id);
    cell.classList.toggle("sel", selected === id);
    if (flashIds.has(id)) {
      cell.classList.remove("flash");
      void cell.offsetWidth; // restarts the animation
      cell.classList.add("flash");
    }
  }
  flashIds.clear();
}

/** A known ID's cell: a gap, or under "show known" grey with its value. Never dimmed, ringed or flashed. */
function renderKnownCell(cell, id, raw) {
  cell.classList.toggle("gone", !showKnown);
  cell.classList.toggle("known", showKnown);
  if (!showKnown) {
    cell.replaceChildren();
    cell.title = `${id}: ${KNOWN_GAP_TEXT}`;
    return;
  }
  cell.replaceChildren(el("span", {}, String(id)));
  if (raw !== null) {
    cell.append(el("code", {}, shown(raw).slice(0, CELL_CHARS)));
  }
  cell.title = knownCellTitle(CATALOGUE, id, raw);
}

/** A filter chip per key of `colours`, in its colour, toggling the key in `chosen`: filter and legend in one. */
function addChips(parent, colours, chosen) {
  for (const [key, colour] of Object.entries(colours)) {
    const box = el("input", { type: "checkbox" });
    box.checked = true;
    box.addEventListener("change", () => {
      if (box.checked) {
        chosen.add(key);
      } else {
        chosen.delete(key);
      }
      render();
    });
    // background-color, not background, so the fading overlay of .faded stays.
    parent.append(el("label", { class: "badge", style: `background-color:${colour}` }, box, key));
  }
}

function clearMark() {
  mark = null;
  filter.onlyChangedSinceMark = false;
}

/** The mark box, and the changes since the mark above the feed while a mark is set. */
function renderMark() {
  $("mark-set").hidden = mark !== null;
  $("mark-on").hidden = mark === null;
  $("mark-changes-box").hidden = mark === null;
  $("f-since-mark").checked = filter.onlyChangedSinceMark;
  if (mark === null) {
    return;
  }
  const changes = markChanges(CATALOGUE, copy, mark);
  $("mark-count").textContent = String(changes.length);
  $("mark-at").textContent = `mark set ${new Date(mark.setAtMs).toLocaleTimeString()}`;
  if (changes.length === 0) {
    $("mark-changes").replaceChildren(
      el("span", { class: "mute" }, "nothing yet: change a setting on the panel, then scan again"));
    return;
  }
  $("mark-changes").replaceChildren(
    ...changes.map((change) =>
      el("div", { "data-id": change.id },
        el("b", {}, String(change.id)), " ",
        el("code", {}, shown(change.markRaw)), " → ", el("code", {}, shown(change.raw)))),
  );
}

function renderFeed(visible) {
  const entries = changeFeed(copy, mutes).filter((entry) => visible.has(entry.id)).slice(0, FEED_LENGTH);
  if (entries.length === 0) {
    $("feed").replaceChildren(el("span", { class: "mute" }, "none yet"));
    return;
  }
  $("feed").replaceChildren(
    ...entries.map((entry) =>
      el("div", { "data-id": entry.id },
        el("span", { class: "mute" }, new Date(entry.atMs).toLocaleTimeString()), " ",
        el("b", {}, String(entry.id)), " ",
        el("code", {}, shown(entry.from)), " → ", el("code", {}, shown(entry.to)))),
  );
}

function renderDrawer(rowsById) {
  $("drawer").hidden = selected === null;
  if (selected === null) {
    drawerFor = null;
    return;
  }
  const row = rowsById.get(selected);
  const head = el("div", { class: "row" }, el("b", {}, `ID ${selected}`));
  // The note field stays in place across polls, so typing keeps focus; it is refilled only for another ID.
  const note = $("note");
  if (drawerFor !== selected) {
    note.value = notes[selected] ?? "";
    note.placeholder = `Note for ID ${selected} (browser only, in the export)`;
    drawerFor = selected;
  }
  note.hidden = !row;
  if (!row) {
    head.append(el("span", { class: "mute" }, "never seen"), el("span", { class: "grow" }), el("button", { "data-action": "close" }, "×"));
    $("drawer-info").replaceChildren(head);
    return;
  }
  head.append(
    row.type ? el("span", { class: "badge", style: `background:${TYPE_COLOURS[row.type]}` }, row.type) : null,
    row.stale ? el("span", { class: "badge" }, "stale: browser copy only") : null,
    el("span", { class: "grow" }),
    el("button", { "data-action": "mute" }, mutes.has(selected) ? "Unmute in feed" : "Mute in feed"),
    el("button", { "data-action": "close" }, "×"),
  );
  const value = el("div", { class: "value" }, el("code", {}, shown(row.raw)));
  if (isPadded(row.raw)) {
    value.append(el("span", { class: "mute", title: `padded on the wire: "${row.raw}"` }, " ␣ padded"));
  }
  const fact = (label, ...value) => el("tr", {}, el("td", { class: "mute" }, label), el("td", {}, ...value));
  const facts = el("table", {},
    fact("Query status",
      el("span", { class: `s-${row.status}` }, row.status), row.statusAtMs === null ? "" : ` · ${formatWall(row.statusAtMs)}`),
    fact("Changes", String(row.changeCount)),
    fact("Last change", formatWall(row.changedAtMs)),
    fact("First / last seen", `${formatWall(row.firstSeenMs)} / ${formatWall(row.lastSeenMs)}`),
    fact("Command id", String(row.cmd ?? "—")),
  );
  const history = row.history.length === 0
    ? [el("div", { class: "mute" }, "no history")]
    : row.history.map((entry, i) =>
      el("div", {}, el("span", { class: "mute" }, formatWall(entry.atMs)), " ", el("code", {}, shown(entry.raw)),
        i === 0 ? el("span", { class: "mute" }, " ← current") : null));
  $("drawer-info").replaceChildren(head, value, facts, el("b", {}, "History"), ...history);
}

function render() {
  const rows = rowsOf(copy, notes);
  renderHeader();
  renderTabs();
  renderScan();
  if (goal === GOALS.check) {
    // Check has no map: changes seen meanwhile do not flash when discover opens again.
    flashIds.clear();
    renderCheck(rows);
    return;
  }
  const rowsById = new Map(rows.map((row) => [row.id, row]));
  const now = Date.now();
  const visible = visibleIds(CATALOGUE, rows, filter, now, mark);
  $("known-gap-legend").textContent = `${showKnown ? "grey" : "blank"}: ${KNOWN_GAP_TEXT}`;
  $("f-types").classList.toggle("faded", colourBy !== "type");
  $("f-statuses").classList.toggle("faded", colourBy !== "status");
  renderGrid(rowsById, visible);
  renderMark();
  renderFeed(visible);
  renderDrawer(rowsById);
}

/** Renders from a poll or at page open: a rendering bug is logged, not mistaken for the device being offline. */
function renderLogged() {
  try {
    render();
  } catch (error) {
    console.error("render failed", error);
  }
}

function download(name, text, type) {
  const link = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  // Safari can cancel a download from a detached link, or one whose URL is revoked right after the click.
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 0);
}

// ───── events ─────
function select(id) {
  selected = selected === id ? null : id;
  render();
}

$("grid").addEventListener("click", (event) => {
  const cell = event.target.closest(".cell[data-id]");
  if (cell) {
    select(Number(cell.dataset.id));
  }
});
/** A feed or mark-changes entry selects its ID. */
function selectEntry(event) {
  const entry = event.target.closest("[data-id]");
  if (entry) {
    selected = Number(entry.dataset.id);
    render();
  }
}
$("feed").addEventListener("click", selectEntry);
$("mark-changes").addEventListener("click", selectEntry);
$("drawer").addEventListener("click", (event) => {
  const action = event.target.dataset.action;
  if (action === "close") {
    selected = null;
  } else if (action === "mute") {
    if (mutes.has(selected)) {
      mutes.delete(selected);
    } else {
      mutes.add(selected);
    }
    save();
  } else {
    return;
  }
  render();
});
$("drawer").addEventListener("input", (event) => {
  if (event.target.id !== "note") {
    return;
  }
  const text = event.target.value;
  if (text) {
    notes[selected] = text;
  } else {
    delete notes[selected];
  }
  save();
  // The note field is not rebuilt by render, so it keeps focus; the ✎ marker and note search update now.
  render();
});
$("f-query").addEventListener("input", (event) => {
  filter.query = event.target.value;
  render();
});
$("f-since-mark").addEventListener("change", (event) => {
  filter.onlyChangedSinceMark = event.target.checked;
  render();
});
$("mark-set").addEventListener("click", () => {
  mark = markNow(copy, Date.now());
  filter.onlyChangedSinceMark = true;
  render();
});
$("mark-move").addEventListener("click", () => {
  mark = markNow(copy, Date.now());
  render();
});
$("mark-clear").addEventListener("click", () => {
  clearMark();
  render();
});
$("f-changed").addEventListener("change", (event) => {
  filter.changedWithinMs = Number(event.target.value);
  render();
});
$("colour-by").addEventListener("change", (event) => {
  colourBy = event.target.value;
  render();
});
$("show-known").addEventListener("change", (event) => {
  showKnown = event.target.checked;
  render();
});
$("scan-toggle").addEventListener("click", toggleScan);
$("goal-tabs").addEventListener("click", (event) => {
  const tab = event.target.closest("[data-goal]");
  if (tab) {
    setGoal(tab.dataset.goal);
  }
});
$("export-json").addEventListener("click", () =>
  download("sec_touch_sniffer.json", exportJson(CATALOGUE, copy, notes, mark, Date.now()), "application/json"));
$("export-csv").addEventListener("click", () =>
  download("sec_touch_sniffer.csv", exportCsv(CATALOGUE, copy, notes, mark), "text/csv"));

buildStatic();
renderTabs();
const storedMac = lastMac();
if (storedMac !== null) {
  // Shows (and exports) the stored copy even when the device is offline at page open.
  load(storedMac);
  renderLogged();
}
poller.start();
</script>
</body>
</html>
