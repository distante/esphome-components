<!doctype html>
<!--
  The sniffer page (.specs/sniffer.md, "Page"). The build (page_bundle.py) inlines the ./*.mjs modules it imports
  and gzips it into flash; the device serves it at GET /sniffer. catalogue.mjs is no file: page_bundle.py generates
  it from C++ headers (its docstring), so the page only runs bundled. To work on it without flashing,
  bundle it and open it with ?device=http://<device-ip> (readme.md, "Tests"): the data endpoints allow any origin.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC-Touch sniffer</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --mute:#6e6e73; --line:#ddd; --acc:#0a66c2; --bad:#c0392b; --ok:#1e8449;
    --cand:#e67e22; }
  * { box-sizing:border-box; }
  /* Beats the display of .row, .cards and the rest, so `hidden` always hides. */
  [hidden] { display:none !important; }
  /* A column the height of the window: discover's map takes what the rows above it leave. */
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:0 12px 12px;
    height:100vh; display:flex; flex-direction:column; }
  h1 { font-size:15px; margin:10px 0; }
  button, input, select, textarea { font:inherit; }
  button { padding:3px 9px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--acc); color:#fff; border:1px solid var(--acc); border-radius:3px; }
  button.link { border:none; background:none; color:var(--acc); padding:0 2px; text-decoration:underline; }
  code { font-family:ui-monospace, Menlo, monospace; }
  .mute { color:var(--mute); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .row .row { margin:0; }
  .grow { flex:1; }
  .badge { display:inline-block; padding:0 5px; border-radius:3px; font-size:11px; border:1px solid var(--line); background:#fff; }
  .offline { background:var(--bad); color:#fff; border-color:var(--bad); }
  .bar { height:8px; background:#e5e5e5; border-radius:4px; overflow:hidden; min-width:120px; }
  .bar > i { display:block; height:100%; background:var(--acc); }
  #discover-view { flex:1 1 0; min-height:0; display:flex; flex-direction:column; }
  /* All 256 cells fit: the grid fills the width left of the side column and the height left in the window. */
  #main { flex:1 1 0; min-height:380px; display:flex; gap:12px; }
  #grid { flex:1; min-width:0; display:grid; gap:2px;
    grid-template-columns:repeat(16, minmax(0, 1fr)); grid-template-rows:repeat(16, minmax(0, 1fr)); }
  .cell { font-size:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; background:#f7f7f7; border:1px solid #e2e2e2; }
  .cell code { font-size:10px; max-width:100%; overflow:hidden; white-space:nowrap; }
  .cell.unseen { background:#fff; border:1px dashed #bbb; }
  /* A known property: discover leaves a gap, check shows it. */
  .cell.gone { background:transparent; border:none; cursor:default; }
  /* A known property under "show known": grey, with no type or status colour, and not clickable. */
  .cell.known { background:#e4e4e4; border-color:#d2d2d2; color:#777; cursor:default; }
  /* The open experiment's candidates: orange, corroborated green. */
  .ring-cand { box-shadow:inset 0 0 0 3px var(--cand); }
  .ring-corr { box-shadow:inset 0 0 0 3px var(--ok); }
  .cell.stale { opacity:.45; font-style:italic; }
  .dim { background-image:repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.2) 4px 6px); }
  .cell.dim { opacity:.35; }
  .cell.dim:hover { opacity:1; }
  .cell.cursor { outline:3px solid var(--acc); }
  .cell.sel { outline:2px solid red; }
  .flash { animation:flash 2s; }
  /* The chips of the group "colour by" does not use: their colour is not on the map, so it fades. */
  .faded > .badge { background-image:linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,.7)); }
  /* No `to`: the flash fades into the cell's own box-shadow, the candidate ring on a candidate's cell. */
  @keyframes flash { from { box-shadow:inset 0 0 0 40px #ffe58a; } }
  #side { width:340px; flex:none; overflow:auto; }
  .box { background:#fff; border:1px solid var(--line); padding:8px; margin-bottom:10px; }
  #drawer .value { font-size:20px; margin:6px 0; word-break:break-all; }
  #drawer textarea { width:100%; min-height:60px; }
  #drawer table td { padding:1px 6px 1px 0; vertical-align:top; }
  .unexpected { color:var(--bad); }
  .list { margin-bottom:10px; }
  .list div { cursor:pointer; border-bottom:1px solid var(--line); padding:2px 0; }
  .s-ok { color:var(--ok); } .s-nak { color:var(--bad); } .s-timeout { color:#b9770e; } .s-unqueried { color:#999; }
  .bigtabs { display:flex; margin:8px 0; border-bottom:2px solid var(--line); }
  .bigtabs button { flex:1; border:none; background:none; padding:8px 16px; font-size:14px;
    border-bottom:3px solid transparent; margin-bottom:-2px; text-align:left; }
  .bigtabs button.on { border-bottom-color:var(--acc); font-weight:600; }
  .bigtabs small { font-weight:400; color:var(--mute); font-size:12px; }
  #range input { width:4em; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card .big { font-size:18px; }
  .card .gap { margin-top:6px; }
  /* Experiments: sub-tabs, the coach box, candidate cards and the capture timeline. */
  .subtabs { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:2px 0 8px; }
  .subtabs button { border:none; background:none; padding:5px 12px; border-bottom:2px solid transparent;
    margin-bottom:-1px; }
  .subtabs button.on { border-bottom-color:var(--cand); font-weight:600; }
  .coach { background:#fffaf2; border:1px solid #f3d9b5; padding:10px; margin-bottom:10px; }
  .coach .step { font-size:15px; margin-bottom:8px; }
  .coach input.label { font-size:16px; padding:4px 6px; width:150px; }
  .coach button.primary { font-size:15px; padding:4px 14px; }
  #cards .card { margin-bottom:8px; padding:8px; }
  #cards .card.corr { border-color:var(--ok); }
  #cards .card h3 { display:flex; gap:6px; align-items:center; }
  .badge.cand { background:#fdebd0; border-color:var(--cand); }
  .badge.corr { background:var(--ok); color:#fff; border-color:var(--ok); }
  table.lr { border-collapse:collapse; margin:4px 0; }
  table.lr td, table.lr th { padding:1px 8px 1px 0; text-align:left; font-weight:400; }
  table.lr th { color:var(--mute); font-size:11px; }
  .probe { font-size:12px; margin-top:3px; }
  .probe .ok { color:var(--ok); } .probe .bad { color:var(--bad); }
  .timeline { border-left:2px solid var(--line); margin:4px 0 10px 6px; padding-left:10px; }
  .timeline div { position:relative; padding:2px 0; }
  .timeline div::before { content:""; position:absolute; left:-15px; top:8px; width:8px; height:8px;
    border-radius:50%; background:var(--mute); }
  /* A narrowed capture gets a hollow dot. */
  .timeline div.narrow::before { background:#fff; border:2px solid var(--mute); width:4px; height:4px; }
  @media (max-width:900px) {
    body, #discover-view { height:auto; display:block; }
    #main { flex-direction:column; }
    #grid { grid-template-rows:none; }
    .cell { aspect-ratio:1; }
    #side { width:100%; }
  }
</style>
</head>
<body>
<div class="row">
  <h1 id="title">SEC-Touch sniffer</h1>
  <span id="online" class="badge">connecting…</span>
  <span id="device" class="mute"></span>
  <span class="grow"></span>
  <label title="Off: muted IDs are left out of the records and the capture entries"><input id="include-muted" type="checkbox"> include muted IDs</label>
  <label><input id="only-open" type="checkbox"> only the open experiment</label>
  <button id="export-json">Export JSON</button>
  <button id="export-csv">Export CSV</button>
  <button id="clear-data" title="Forget every captured value on the device and in this browser; notes, mutes and experiments stay">Clear data</button>
</div>
<div id="goal-tabs" class="bigtabs"></div>
<div id="scan" class="row" hidden>
  <button id="scan-toggle"></button>
  <span id="busy" class="unexpected"></span>
  <span id="range">
    IDs <input id="range-from" inputmode="numeric" aria-label="from ID">
    – <input id="range-to" inputmode="numeric" aria-label="to ID">
    <span id="range-error" class="unexpected"></span>
  </span>
  <div class="bar grow"><i id="scan-bar"></i></div>
  <span id="scan-label" class="mute"></span>
</div>
<div id="check-view" class="cards" hidden></div>
<div id="discover-view">
<div id="exp-tabs" class="subtabs"></div>
<div class="row">
  <input id="f-query" placeholder="ID, value or note…" style="width:170px">
  <select id="f-changed"></select>
  colour by <select id="colour-by"><option>type</option><option>status</option></select>
  <label><input id="show-known" type="checkbox"> show known</label>
  <label title="Open an experiment to filter by its candidates"><input id="f-candidates" type="checkbox"> only candidates</label>
  <span class="badge" style="border:1px dashed #bbb">never seen</span>
  <span class="badge dim">filtered out</span>
  <span class="badge ring-cand">candidate</span>
  <span class="badge ring-corr">corroborated</span>
  <span id="known-gap-legend" class="mute"></span>
</div>
<div class="row">
  <span id="f-types" class="row"></span>
  <span class="mute">│</span>
  <span id="f-statuses" class="row"></span>
</div>
<div id="main">
  <div id="grid"></div>
  <div id="side">
    <div id="coach" class="coach">
      <div id="coach-step" class="step"></div>
      <div id="new-experiment" class="row">
        <input id="experiment-name" placeholder="setting, e.g. fan 1 mode" style="width:170px">
        <button id="experiment-start">Start experiment</button>
      </div>
      <div id="capture-form">
        <div class="row">
          <input id="capture-label" class="label" list="capture-labels" placeholder="value label, e.g. boost">
          <datalist id="capture-labels"></datalist>
          <button id="capture" class="primary">Capture</button>
          <button id="full-rescan" class="link" title="Make the next capture scan the experiment's full range"></button>
        </div>
        <div id="next-capture" class="mute" style="font-size:12px"></div>
        <div id="capture-note" class="unexpected" style="font-size:12px"></div>
      </div>
    </div>
    <div id="experiment-view">
      <div id="cards"></div>
      <details id="disqualified" class="mute" style="font-size:12px">
        <summary id="disqualified-count"></summary>
        <div id="disqualified-list"></div>
      </details>
      <b>Captures</b> <span class="mute">(newest first)</span>
      <div id="timeline" class="timeline"></div>
    </div>
    <div id="drawer" class="box" hidden>
      <div id="drawer-info"></div>
      <textarea id="note"></textarea>
    </div>
    <b>Changes</b> <span class="mute">(newest first)</span>
    <div id="feed" class="list"></div>
  </div>
</div>
</div>
<script type="module">
import { applyResponse, changeFeed, emptyCopy, rowsOf, wholeDecimal, withProbe, withScan } from "./records.mjs";
import { createPoller, resyncReason, sinceFor } from "./poll.mjs";
import { allPass, feedIds, visibleIds } from "./filters.mjs";
import { captureProgress, scanProgress } from "./scan_progress.mjs";
import {
  acceptedRange,
  busyLine,
  busyText,
  captureStartPath,
  isRunning,
  probeError,
  rangeError,
  scanButton,
  scanReply,
  scanStartPath,
  switchStopsScan,
} from "./scan_control.mjs";
import {
  analyseExperiment,
  coachStep,
  excludedFromExperiments,
  labelsUsed,
  newExperiment,
  nextCapture,
  withCapture,
  withoutCapture,
} from "./experiments.mjs";
import { captureStep, isCaptureRun } from "./capture_run.mjs";
import {
  latestProbe,
  probeChoices,
  probeNote,
  probeReply,
  probeRequest,
  probeTexts,
  reconcileProbe,
  restoreOffer,
  runningProbe,
} from "./write_probe.mjs";
import { checkCards } from "./check_cards.mjs";
import { exportCsv, exportJson } from "./export.mjs";
import { deviceKey, LAST_MAC_KEY, parseStored, storedText } from "./storage.mjs";
import { STATUS_COLOURS, TYPE_COLOURS } from "./colours.mjs";
import { drawerBadges } from "./drawer_head.mjs";
import { knownCellTitle, knownIds, meaningText } from "./known_meaning.mjs";
import { shown } from "./control_bytes.mjs";
import { CATALOGUE } from "./catalogue.mjs";

const ID_COUNT = 256;
/** Known properties are fixed by the catalogue: discover's map leaves a gap for each, once, at page start. */
const KNOWN_ID_SET = new Set(knownIds(CATALOGUE));
/** What a known ID's gap or grey cell in discover's map means: the gap's tooltip and the legend. */
const KNOWN_GAP_TEXT = "known, see Check";
const FEED_LENGTH = 60;
/** A grid cell previews this many characters of its value; the full value is in its tooltip. */
const CELL_CHARS = 6;
const MINUTE_MS = 60_000;
const HOUR_MS = 60 * MINUTE_MS;
/** The "changed recently" filter's choices, as [window in ms, label]; 0 means any time. */
const CHANGED_WITHIN_PRESETS = [
  [0, "changed any time"],
  [5 * MINUTE_MS, "changed < 5 min"],
  [HOUR_MS, "changed < 1 h"],
];
/** The goals as the device names them. */
const GOALS = CATALOGUE.goals;
/** The page tabs, as [goal, title, what the goal does]. */
const GOAL_TABS = [
  [GOALS.discover, "Discover", "find unknown properties"],
  [GOALS.check, "Check", "confirm known properties"],
];
const SWITCH_STOPS_SCAN = "Switching stops the running scan";
/** The registered badge's tooltip, on check's fan cards. */
const REGISTERED_TITLE = "registered: polled by the hub for this YAML";
/** Why the page stored no capture, by `captureStep`'s `why`. */
const ABANDONED_TEXT = {
  stopped: "the scan was stopped: nothing stored; capture again to retry",
  "boot changed": "the device rebooted or its data was cleared: nothing stored; capture again to retry",
  "another run": "another run ended instead: nothing stored; capture again to retry",
};
/** The candidate ring of a cell, by candidate status. */
const RING_CLASSES = { candidate: "ring-cand", corroborated: "ring-corr" };

// Empty on the device; `?device=http://<ip>` while working on the page from a local server.
const DEVICE_URL = new URLSearchParams(location.search).get("device") ?? "";
const $ = (id) => document.getElementById(id);

/** Builds an element: `el("b", {class: "x"}, "text", child)`. */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    node.setAttribute(name, value);
  }
  node.append(...children.filter((child) => child !== null));
  return node;
}

/** A button, disabled when `disabled`. */
function button(attrs, disabled, ...children) {
  const node = el("button", attrs, ...children);
  node.disabled = disabled;
  return node;
}

const isPadded = (raw) => raw !== null && raw !== raw.trim();
const formatWall = (wallMs) => (wallMs === null ? "—" : new Date(wallMs).toLocaleString());

// ───── state: the browser copy, notes, mutes and experiments, kept per device MAC ─────
let mac = null;
let copy = emptyCopy();
let notes = {};
let mutes = new Set();
// The last discover range the device accepted, filled into the range inputs when a device loads.
let range = CATALOGUE.discoverRange;
// Every experiment of this device (experiments.mjs), and the probe or restore awaiting its result (write_probe.mjs).
let experiments = [];
let pendingProbe = null;
// The open tab's goal. Not stored: the page always opens in discover.
let goal = GOALS.discover;
// The open experiment's key, null on "+ new experiment". Not stored.
let openKey = null;
// This page's capture in flight (capture_run.mjs), null when none. Page memory only: a reload abandons it.
let capture = null;
// Why the last capture stored nothing, shown under the coach until the next capture.
let captureNote = null;
// Whether "full rescan" was pressed for the next capture.
let forceFull = false;
// Polls are numbered: what became of a capture or probe is judged only from polls numbered above its `…AfterPoll`.
let pollSerial = 0;
let captureAfterPoll = 0;
// 0 after a page load: any poll can tell what became of a stored pending probe.
let probeAfterPoll = 0;

/**
 * The `…AfterPoll` for a request the device just accepted. A poll sent before the 200 shows the run before it. So can
 * the first poll sent after it: the device's main loop starts the run a moment after the handler accepts it, and until
 * then /sniffer/data still shows the previous run. The page judges from the second poll on, about 1 s later.
 */
const pollAfterAccept = () => pollSerial + 1;
// "busy: <what runs>" after a start refused with 409, until the device runs nothing.
let busy = null;
// The device's error text for the last refused probe or restore, by ID.
const probeErrors = new Map();
// The value chosen in each card's probe select, by ID, so a render keeps it.
const probeSelections = new Map();
// The device's error text for the last refused discover start or capture, null after an accepted one.
let rangeErrorText = null;
let selected = null;
let online = null;
let requestFailed = false;
const filter = allPass();
let colourBy = "type";
// Whether discover's map shows known IDs greyed instead of as gaps. Page memory only: never stored.
let showKnown = false;
let includeMuted = false;
let onlyOpen = false;
const flashIds = new Set();
// The ID whose note the drawer's note field holds.
let drawerFor = null;
// Counts the clears that emptied the copy, so a poll fetched before one is dropped.
let clears = 0;

function load(newMac) {
  mac = newMac;
  // The selection stays, but the note field must refill from the new device's notes.
  drawerFor = null;
  let text = null;
  try {
    text = localStorage.getItem(deviceKey(mac));
  } catch {
    // Blocked storage: the device starts from an empty copy.
  }
  ({ copy, notes, mutes, range, experiments, pendingProbe } = parseStored(text, CATALOGUE.discoverRange));
  // Another device's experiments and capture say nothing about this one.
  openKey = null;
  capture = null;
  captureNote = null;
  forceFull = false;
  probeAfterPoll = 0;
  probeErrors.clear();
  probeSelections.clear();
  // A refused range or a busy device of the previous device says nothing about this one.
  rangeErrorText = null;
  busy = null;
  fillRange();
}

function fillRange() {
  $("range-from").value = String(range.from);
  $("range-to").value = String(range.to);
}

/** The MAC of the last device that answered, so its copy shows at page open even while it is offline. */
function lastMac() {
  try {
    return localStorage.getItem(LAST_MAC_KEY);
  } catch {
    return null;
  }
}

function rememberMac() {
  try {
    localStorage.setItem(LAST_MAC_KEY, mac);
  } catch {
    // Blocked storage: the page just opens empty until the device answers.
  }
}

function save() {
  try {
    localStorage.setItem(deviceKey(mac), storedText({ copy, notes, mutes, range, experiments, pendingProbe }));
  } catch {
    // Full or blocked storage: the page still works, the copy just does not survive a reload.
  }
}

// ───── experiments ─────
const openExperiment = () => experiments.find((experiment) => experiment.key === openKey) ?? null;

const analyse = (experiment) => analyseExperiment(experiment, excludedFromExperiments(CATALOGUE, mutes));

function updateExperiment(key, update) {
  experiments = experiments.map((experiment) => (experiment.key === key ? update(experiment) : experiment));
}

/** Appends a line to an ID's note. */
function appendNote(id, line) {
  notes[id] = notes[id] ? `${notes[id]}\n${line}` : line;
  if (drawerFor === id) {
    // The note field is refilled only for another ID: refill it for this one.
    drawerFor = null;
  }
}

/** Stores a probe entry in its experiment and appends its line to the ID's note; the pending probe is done. */
function takeProbeEntry(experimentKey, entry) {
  updateExperiment(experimentKey, (experiment) => ({ ...experiment, probes: [...experiment.probes, entry] }));
  appendNote(entry.id, probeNote(entry));
  pendingProbe = null;
}

/** What a poll means for this page's capture in flight and its pending probe. */
function followRuns(pollNo) {
  if (capture !== null) {
    const step = captureStep(CATALOGUE, capture, copy, pollNo > captureAfterPoll, Date.now());
    if (step.kind === "store") {
      updateExperiment(capture.experimentKey, (experiment) => withCapture(experiment, step.capture, step.range));
      if (capture.experimentKey === openKey) {
        $("capture-label").value = "";
      }
      capture = null;
    } else if (step.kind === "abandon") {
      captureNote = ABANDONED_TEXT[step.why];
      capture = null;
    }
  }
  const outcome = reconcileProbe(pendingProbe, copy.device?.probe ?? null, pollNo > probeAfterPoll);
  if (outcome.kind === "running") {
    pendingProbe = outcome.pending;
  } else if (outcome.kind === "result" || outcome.kind === "interrupted") {
    takeProbeEntry(pendingProbe.experimentKey, outcome.entry);
  }
  if (!isRunning(currentScan(), currentProbe())) {
    busy = null;
  }
}

// ───── device ─────
/** Fetches from the device; rejects on a network error and on a non-OK status alike. */
async function fetchOk(path, options) {
  const response = await fetch(`${DEVICE_URL}${path}`, options);
  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }
  return response;
}

async function fetchData(since) {
  const response = await fetchOk(`/sniffer/data?since=${since}`, { cache: "no-store" });
  return response.json();
}

const currentScan = () => copy.device?.scan ?? null;
const currentProbe = () => copy.device?.probe ?? null;
const deviceRuns = () => isRunning(currentScan(), currentProbe());

async function pollOnce() {
  pollSerial += 1;
  const pollNo = pollSerial;
  const clearsBefore = clears;
  let response = await fetchData(sinceFor(copy));
  if (response.mac !== mac) {
    load(response.mac);
    rememberMac();
    // The stored copy's `since` is unset, so this is a resync unless the response was full already.
  }
  if (resyncReason(copy, response) !== null) {
    copy = { ...copy, since: null };
    response = await fetchData(0);
  }
  // A clear landed while this poll was out: its response holds the records just cleared. The next poll is a full one.
  if (clears !== clearsBefore) {
    return;
  }
  const result = applyResponse(copy, response, Date.now());
  copy = result.copy;
  for (const id of result.changedIds) {
    flashIds.add(id);
  }
  // The device answered, so a failed request no longer describes it.
  requestFailed = false;
  followRuns(pollNo);
  save();
  renderLogged();
}

const poller = createPoller({
  poll: pollOnce,
  setTimer: (fn, ms) => setTimeout(fn, ms),
  clearTimer: (timer) => clearTimeout(timer),
  onOnline: (isOnline) => {
    online = isOnline;
    renderHeader();
  },
});

/** A reply's body; a body that breaks off reads as empty, which the reply parsers take as no object. */
const replyText = (response) => response.text().catch(() => "");

/**
 * Puts the scan of a start or stop reply into the copy at once, so the scan control decides on it rather than on the
 * last poll's. Dropped when another device answered while the request was out.
 *
 * @returns {object | null} the reply's scan, null when it was dropped or the body held none
 */
function takeScanReply(requestMac, bodyText) {
  const scan = scanReply(bodyText);
  if (scan === null || mac !== requestMac) {
    return null;
  }
  copy = withScan(copy, scan);
  return scan;
}

/** @returns {Promise<boolean>} whether the device accepted the stop */
async function stopScan() {
  const requestMac = mac;
  let stopped = false;
  try {
    const response = await fetchOk("/sniffer/scan/stop", { method: "POST" });
    requestFailed = false;
    stopped = true;
    takeScanReply(requestMac, await replyText(response));
    poller.pollNow();
  } catch (error) {
    // No poll at once: it would clear the failure before it shows. The next scheduled poll clears it.
    console.error("scan stop request failed", error);
    requestFailed = true;
  }
  renderLogged();
  return stopped;
}

/** Empties the device's records, then the browser copy; notes, mutes, experiments and the range stay. */
async function clearData() {
  // No device known yet: nothing to clear.
  if (mac === null) {
    return;
  }
  if (!confirm("Clear every captured value on the device and in this browser? Notes, mutes and experiments stay.")) {
    return;
  }
  const requestMac = mac;
  try {
    await fetchOk("/sniffer/clear", { method: "POST" });
  } catch (error) {
    console.error("clear request failed", error);
    alert("The device did not clear its records; nothing was cleared.");
    return;
  }
  // Another device answered while the request was out: its copy is not the one cleared.
  if (mac === requestMac) {
    clears += 1;
    copy = emptyCopy();
    flashIds.clear();
    save();
  }
  renderLogged();
  poller.pollNow();
}

/**
 * Sends a scan start. 400 shows the device's error next to the range, 409 shows what runs.
 *
 * @returns {Promise<object | null>} the accepted start's reply scan (or `{}` when its body held none); null when the
 *   device refused it or did not answer
 */
async function sendStart(path) {
  const requestMac = mac;
  try {
    const response = await fetch(`${DEVICE_URL}${path}`, { method: "POST" });
    if (response.status === 400 || response.status === 409) {
      requestFailed = false;
      const text = await replyText(response);
      if (mac === requestMac) {
        if (response.status === 400) {
          rangeErrorText = rangeError(text);
        } else {
          busy = busyText(CATALOGUE, text);
        }
      }
      return null;
    }
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    requestFailed = false;
    rangeErrorText = null;
    busy = null;
    // The device accepted the start: a body the page cannot read is no failure, the poll brings the scan.
    return takeScanReply(requestMac, await replyText(response)) ?? {};
  } catch (error) {
    // No poll at once: it would clear the failure before it shows. The next scheduled poll clears it.
    console.error("scan start request failed", error);
    requestFailed = true;
    return null;
  } finally {
    renderLogged();
  }
}

/** Starts the open tab's goal; discover sends the range as typed, and the device decides whether it is valid. */
async function startScan() {
  const startGoal = goal;
  const fromText = $("range-from").value;
  const toText = $("range-to").value;
  const scan = await sendStart(scanStartPath(CATALOGUE, startGoal, fromText, toText));
  if (scan === null) {
    return;
  }
  const accepted = startGoal === GOALS.discover ? acceptedRange(CATALOGUE, scan, fromText, toText) : null;
  if (accepted !== null) {
    range = accepted;
    save();
  }
  poller.pollNow();
  renderLogged();
}

function toggleScan() {
  if (currentScan()?.active) {
    return stopScan();
  }
  return deviceRuns() ? null : startScan();
}

/** Captures the open experiment at the label typed: its full range, or only its candidates. */
async function startCapture() {
  const experiment = openExperiment();
  const label = $("capture-label").value;
  if (experiment === null || label.trim() === "" || capture !== null || deviceRuns()) {
    return;
  }
  const from = wholeDecimal($("range-from").value);
  const to = wholeDecimal($("range-to").value);
  if (experiment.range === null && (from === null || to === null)) {
    rangeErrorText = "the range must be two IDs";
    renderLogged();
    return;
  }
  const next = nextCapture(CATALOGUE, experiment, analyse(experiment), { from, to }, forceFull);
  captureNote = null;
  const bootAtStart = copy.boot;
  const requestMac = mac;
  const scan = await sendStart(captureStartPath(CATALOGUE, next));
  if (scan === null || mac !== requestMac) {
    // Refused, unanswered, or another device answered meanwhile: its capture is not this one.
    return;
  }
  // A 200 means the next finished run is this page's own.
  capture = { experimentKey: experiment.key, experimentName: experiment.name, label, next, boot: bootAtStart };
  captureAfterPoll = pollAfterAccept();
  forceFull = false;
  const accepted = next.full ? acceptedRange(CATALOGUE, scan, String(next.from), String(next.to)) : null;
  if (accepted !== null) {
    range = accepted;
    save();
  }
  poller.pollNow();
  renderLogged();
}

/** Starts a write probe or a restore of `id` to `value` from the open experiment's card. */
async function startProbe(kind, id, value) {
  const experiment = openExperiment();
  if (experiment === null || pendingProbe !== null || deviceRuns()) {
    return;
  }
  const requestMac = mac;
  probeErrors.delete(id);
  // Stored before the request: if the device reboots mid-probe, the page can still tell it was interrupted.
  pendingProbe = {
    experimentKey: experiment.key,
    kind,
    id,
    value,
    original: kind === "restore" ? value : null,
    steps: [],
    atMs: Date.now(),
  };
  // No poll judges it while the request is out: the device may not have it yet.
  probeAfterPoll = Infinity;
  save();
  renderLogged();
  const request = probeRequest(kind, id, value);
  try {
    // text/plain: a form body never reaches the device's handler.
    const response = await fetch(`${DEVICE_URL}${request.path}`, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: request.body,
    });
    const text = await replyText(response);
    requestFailed = false;
    if (mac !== requestMac) {
      // Another device answered meanwhile: the request's pending probe was the other device's, and load() dropped it.
      return;
    }
    if (response.status === 400 || response.status === 409) {
      pendingProbe = null;
      probeAfterPoll = 0;
      if (response.status === 400) {
        probeErrors.set(id, probeError(text));
      } else {
        busy = busyText(CATALOGUE, text);
      }
      save();
      return;
    }
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    probeAfterPoll = pollAfterAccept();
    const probe = probeReply(text);
    if (probe !== null) {
      copy = withProbe(copy, probe);
    }
    poller.pollNow();
  } catch (error) {
    // The device may have taken it: the pending probe stays, and the polls tell what became of it.
    console.error("probe request failed", error);
    probeAfterPoll = pollAfterAccept();
    requestFailed = true;
  } finally {
    renderLogged();
  }
}

/**
 * Opens a goal's tab. Leaving a running scan's goal stops that scan, after asking; the page never starts one. The
 * confirm promised a stop, so a stop that fails keeps the tab, and the header shows the failure.
 */
async function setGoal(target) {
  if (target === goal) {
    return;
  }
  if (switchStopsScan(currentScan(), target)) {
    if (!confirm(SWITCH_STOPS_SCAN)) {
      return;
    }
    if (!(await stopScan())) {
      return;
    }
  }
  goal = target;
  // The range error belongs to discover's last start, not to the tab opened now.
  rangeErrorText = null;
  renderLogged();
}

// ───── rendering ─────
const cells = [];

function buildStatic() {
  for (let id = 0; id < ID_COUNT; id++) {
    // No data-id on a known ID: it is never selected.
    const cell = KNOWN_ID_SET.has(id) ? el("div", { class: "cell" }) : el("div", { class: "cell", "data-id": id });
    cells.push(cell);
    $("grid").append(cell);
  }
  addChips($("f-types"), TYPE_COLOURS, filter.types);
  addChips($("f-statuses"), STATUS_COLOURS, filter.statuses);
  $("f-changed").append(...CHANGED_WITHIN_PRESETS.map(([ms, label]) => el("option", { value: ms }, label)));
  $("goal-tabs").append(...GOAL_TABS.map(([tabGoal, title, does]) =>
    el("button", { "data-goal": tabGoal }, title, " ", el("small", {}, `— ${does}`))));
  fillRange();
}

function renderHeader() {
  const device = copy.device;
  if (device !== null) {
    $("title").textContent = `SEC-Touch sniffer · ${device.name}`;
    $("device").textContent = `${mac} · ${Object.keys(copy.records).length} IDs`;
  }
  const state = online === false ? "offline, retrying" : online ? "live" : "connecting…";
  $("online").textContent = requestFailed ? `${state} · request failed` : state;
  $("online").classList.toggle("offline", online === false || requestFailed);
  $("only-open").disabled = openKey === null;
}

function renderScan() {
  const scan = currentScan();
  $("scan").hidden = scan === null;
  if (scan === null) {
    return;
  }
  const progress = capture !== null && isCaptureRun(CATALOGUE, capture, scan)
    ? captureProgress(CATALOGUE, capture, scan)
    : scanProgress(scan, CATALOGUE, goal);
  const probe = currentProbe();
  const toggle = scanButton(scan, probe, goal);
  $("scan-toggle").textContent = toggle.label;
  $("scan-toggle").disabled = toggle.disabled;
  $("busy").textContent = busyLine(CATALOGUE, busy, scan, probe);
  $("scan-bar").style.width = `${progress.percent}%`;
  $("scan-label").textContent = progress.label;
  $("range").hidden = goal !== GOALS.discover;
  $("range-error").textContent = rangeErrorText ?? "";
}

function renderTabs() {
  for (const tab of $("goal-tabs").children) {
    tab.classList.toggle("on", tab.dataset.goal === goal);
  }
  $("discover-view").hidden = goal !== GOALS.discover;
  $("check-view").hidden = goal !== GOALS.check;
}

/** A known property's meaning: red when unexpected, "not seen" while it has no value. */
function meaningView(meaning, size = "") {
  if (meaning === null) {
    return el("span", { class: `mute ${size}`.trim() }, meaningText(meaning));
  }
  const classes = `${meaning.unexpected ? "unexpected" : ""} ${size}`.trim();
  return el("span", classes ? { class: classes } : {}, meaningText(meaning));
}

const registeredBadge = () => el("span", { class: "badge", title: REGISTERED_TITLE }, "registered");

const rawView = (property) => el("span", { class: "mute" }, `${property.id} = `, el("code", {}, shown(property.raw)));

function renderCheck(rows) {
  const { fans, global } = checkCards(CATALOGUE, rows);
  const fanCards = fans.map((card) =>
    el("div", { class: "card" },
      el("h3", {}, `Fan ${card.fan} `,
        card.registered ? registeredBadge() : null),
      el("div", {}, meaningView(card.level.meaning, "big")),
      el("div", {}, rawView(card.level)),
      el("div", { class: "gap" }, "label: ", meaningView(card.label.meaning)),
      el("div", {}, rawView(card.label))));
  const globalCard = el("div", { class: "card" }, el("h3", {}, "Global"),
    ...global.map((property) =>
      el("div", {}, `${property.name}: `, meaningView(property.meaning), " (", rawView(property), ")")));
  $("check-view").replaceChildren(...fanCards, globalCard);
}

function cellColour(row) {
  // An ID with no value has no type, so it shows its status colour.
  return (colourBy === "type" && TYPE_COLOURS[row.type]) || STATUS_COLOURS[row.status];
}

/** @param {Map<number, string>} statuses the open experiment's candidate status by ID; empty with none open */
function renderGrid(rowsById, visible, statuses) {
  const scan = currentScan();
  for (let id = 0; id < ID_COUNT; id++) {
    const cell = cells[id];
    const row = rowsById.get(id);
    if (KNOWN_ID_SET.has(id)) {
      renderKnownCell(cell, id, row?.raw ?? null);
      continue;
    }
    cell.replaceChildren(el("span", { class: "mute" }, String(id)));
    // backgroundColor, not background, so the filtered-out stripes of .dim stay.
    cell.style.backgroundColor = row ? cellColour(row) : "";
    cell.classList.toggle("unseen", !row);
    cell.title = row ? `${id} = ${shown(row.raw)}` : String(id);
    if (row && row.raw !== null) {
      cell.append(el("code", {}, shown(row.raw).slice(0, CELL_CHARS)));
    }
    if (row && notes[id]) {
      cell.append(el("span", {}, "✎"));
    }
    cell.classList.toggle("stale", Boolean(row?.stale));
    cell.classList.toggle("dim", Boolean(row) && !visible.has(id));
    for (const [status, ring] of Object.entries(RING_CLASSES)) {
      cell.classList.toggle(ring, statuses.get(id) === status);
    }
    cell.classList.toggle("cursor", Boolean(scan?.active) && scan.next === id);
    cell.classList.toggle("sel", selected === id);
    if (flashIds.has(id)) {
      cell.classList.remove("flash");
      void cell.offsetWidth; // restarts the animation
      cell.classList.add("flash");
    }
  }
  flashIds.clear();
}

/** A known ID's cell: a gap, or under "show known" grey with its value. Never dimmed, ringed or flashed. */
function renderKnownCell(cell, id, raw) {
  cell.classList.toggle("gone", !showKnown);
  cell.classList.toggle("known", showKnown);
  if (!showKnown) {
    cell.replaceChildren();
    cell.title = `${id}: ${KNOWN_GAP_TEXT}`;
    return;
  }
  cell.replaceChildren(el("span", {}, String(id)));
  if (raw !== null) {
    cell.append(el("code", {}, shown(raw).slice(0, CELL_CHARS)));
  }
  cell.title = knownCellTitle(CATALOGUE, id, raw);
}

/** A filter chip per key of `colours`, in its colour, toggling the key in `chosen`: filter and legend in one. */
function addChips(parent, colours, chosen) {
  for (const [key, colour] of Object.entries(colours)) {
    const box = el("input", { type: "checkbox" });
    box.checked = true;
    box.addEventListener("change", () => {
      if (box.checked) {
        chosen.add(key);
      } else {
        chosen.delete(key);
      }
      render();
    });
    // background-color, not background, so the fading overlay of .faded stays.
    parent.append(el("label", { class: "badge", style: `background-color:${colour}` }, box, key));
  }
}

function renderExperimentTabs() {
  const tabs = experiments.map((experiment) =>
    el("button", { "data-experiment": experiment.key, class: experiment.key === openKey ? "on" : "" },
      experiment.name, " ", el("span", { class: "mute" }, `(${analyse(experiment).candidates.length})`)));
  $("exp-tabs").replaceChildren(
    el("span", { class: "mute", style: "padding:5px 8px 0 0" }, "Experiments:"),
    ...tabs,
    el("button", { "data-experiment": "", class: openKey === null ? "on" : "" }, "+ new experiment"));
}

/** The coach's next-step prompt (experiments.mjs, `coachStep`). */
function coachText(experiment, analysis) {
  const step = coachStep(experiment, analysis);
  const name = experiment.name;
  switch (step.step) {
    case "first":
      return `Set ${name} on the panel to any value, name that value, and capture.`;
    case "change":
      return `Change ${name} to a different value, name it, and capture.`;
    case "round trip":
      return `Go back to “${step.label}” and capture: a round trip finds candidates.`;
    case "corroborate":
      return `Capture “${step.label}” again to corroborate.`;
    case "probe":
      return `ID ${step.ids.join(", ")} corroborated: run a write probe, or capture other values.`;
    default:
      return "No candidate left: the next capture scans the full range again.";
  }
}

function renderCoach(experiment, analysis) {
  $("new-experiment").hidden = experiment !== null;
  $("capture-form").hidden = experiment === null;
  $("experiment-view").hidden = experiment === null;
  if (experiment === null) {
    $("coach-step").textContent = "What setting will you change on the panel?";
    return;
  }
  $("coach-step").textContent = coachText(experiment, analysis);
  $("capture-labels").replaceChildren(...labelsUsed(experiment).map((label) => el("option", { value: label })));
  $("capture").disabled = capture !== null || deviceRuns();
  $("capture").textContent = capture !== null ? "Capturing…" : "Capture";
  $("full-rescan").textContent = forceFull ? "narrow again" : "full rescan";
  const inputRange = { from: wholeDecimal($("range-from").value), to: wholeDecimal($("range-to").value) };
  const next = nextCapture(CATALOGUE, experiment, analysis, inputRange, forceFull);
  $("full-rescan").hidden = !forceFull && next.full;
  $("next-capture").textContent = next.full
    ? `next capture: full range ${next.from ?? "?"}–${next.to ?? "?"}`
    : `next capture: ${next.ids.length} candidates`;
  $("capture-note").textContent = captureNote ?? "";
}

function labelTable(candidate) {
  return el("table", { class: "lr" },
    el("tr", {}, el("th", {}, "label"), el("th", {}, "raw"), el("th", {}, "seen")),
    ...candidate.values.map((value) =>
      el("tr", {},
        el("td", {}, value.label),
        el("td", {}, value.raw === null ? el("span", { class: "s-nak" }, "NAK") : el("code", {}, shown(value.raw))),
        el("td", { class: "mute" }, `${value.count}×`))));
}

/** A probe's steps, verdict and restore, as on the card. */
function probeView(probe) {
  const texts = probeTexts(probe);
  const good = probe.verdict === "writable" && probe.restore !== "failed";
  const verdictClass = good ? "ok" : probe.interrupted || probe.restore === "failed" ? "bad" : "";
  return el("div", { class: "probe" },
    el("b", {}, texts.title),
    texts.verdict === null ? null : el("span", { class: verdictClass }, `: ${texts.verdict}`),
    el("div", { class: "mute" }, texts.steps.join(" · ")),
    texts.restore === null ? null : el("div", { class: probe.restore === "failed" ? "bad" : "" }, texts.restore));
}

/** A corroborated candidate's write probe: the select of observed values, the button, the result, a restore. */
function probeControls(experiment, candidate, row) {
  const runs = deviceRuns() || pendingProbe !== null;
  const choices = probeChoices(CATALOGUE, experiment, candidate.id, row?.raw ?? null);
  const kept = probeSelections.get(candidate.id);
  const chosen = choices.values.includes(kept) ? kept : choices.chosen;
  const select = el("select", { "data-probe-select": candidate.id, title: "only values this experiment observed" },
    ...choices.values.map((value, i) => el("option", { value: String(i) }, `“${shown(value)}”`)));
  select.value = String(choices.values.indexOf(chosen));
  const probeButton = button({ "data-probe": candidate.id, title: "SET the value, read it back, then restore" },
    runs || chosen === null, "Write probe");
  const parts = [el("div", { class: "row" }, "write ", select, probeButton)];
  const error = probeErrors.get(candidate.id);
  if (error !== undefined) {
    parts.push(el("div", { class: "probe unexpected" }, error));
  }
  const mine = pendingProbe !== null && pendingProbe.experimentKey === experiment.key && pendingProbe.id === candidate.id;
  const shownProbe = mine ? runningProbe(pendingProbe, currentProbe()) : latestProbe(experiment, candidate.id);
  if (shownProbe !== null) {
    parts.push(probeView(shownProbe));
  }
  const restoreTo = mine ? null : restoreOffer(CATALOGUE, shownProbe);
  if (restoreTo !== null) {
    parts.push(button({ "data-restore": candidate.id }, runs, `restore “${shown(restoreTo)}”`));
  }
  return parts;
}

function renderCards(experiment, analysis, rowsById) {
  // Rebuilding the cards would close a probe select the user has open: they wait until it loses focus.
  if (document.activeElement?.closest("#cards select")) {
    return;
  }
  const cards = analysis.candidates.map((candidate) => {
    const corroborated = candidate.status === "corroborated";
    const row = rowsById.get(candidate.id);
    return el("div", { class: `card ${corroborated ? "corr" : ""}`.trim() },
      el("h3", {},
        el("button", { class: "link", "data-select": candidate.id }, `ID ${candidate.id}`),
        el("span", { class: `badge ${corroborated ? "corr" : "cand"}` }, candidate.status),
        el("span", { class: "grow" }),
        el("code", { class: "mute" }, shown(row?.raw ?? null))),
      labelTable(candidate),
      ...(corroborated
        ? probeControls(experiment, candidate, row)
        : [el("div", { class: "mute", style: "font-size:12px" }, "write probe once corroborated")]));
  });
  $("cards").replaceChildren(...cards);
  const { disqualified } = analysis;
  $("disqualified").hidden = disqualified.length === 0;
  $("disqualified-count").textContent = `${disqualified.length} disqualified`;
  $("disqualified-list").replaceChildren(...disqualified.map((entry) =>
    el("div", {}, el("button", { class: "link", "data-select": entry.id }, `ID ${entry.id}`), ": ",
      entry.conflicts.map((conflict) =>
        `${conflict.label} = ${conflict.raws.map((raw) => (raw === null ? "NAK" : shown(raw))).join(" / ")}`)
        .join("; "))));
}

function renderTimeline(experiment) {
  if (experiment.captures.length === 0) {
    $("timeline").replaceChildren(el("div", { class: "mute" }, "none yet"));
    return;
  }
  const entries = experiment.captures.map((stored, index) =>
    el("div", { class: stored.full ? "" : "narrow" },
      el("b", {}, stored.label.trim()),
      el("span", { class: "mute" },
        ` · ${new Date(stored.atMs).toLocaleTimeString()} · ${stored.full ? "full" : `${Object.keys(stored.entries).length} IDs`} `),
      el("button", { class: "link", "data-delete": index }, "delete")));
  $("timeline").replaceChildren(...entries.reverse());
}

function renderFeed(listed) {
  const entries = changeFeed(copy, mutes).filter((entry) => listed.has(entry.id)).slice(0, FEED_LENGTH);
  if (entries.length === 0) {
    $("feed").replaceChildren(el("span", { class: "mute" }, "none yet"));
    return;
  }
  $("feed").replaceChildren(
    ...entries.map((entry) =>
      el("div", { "data-id": entry.id },
        el("span", { class: "mute" }, new Date(entry.atMs).toLocaleTimeString()), " ",
        el("b", {}, String(entry.id)), " ",
        el("code", {}, shown(entry.from)), " → ", el("code", {}, shown(entry.to)))),
  );
}

function renderDrawer(rowsById) {
  $("drawer").hidden = selected === null;
  if (selected === null) {
    drawerFor = null;
    return;
  }
  const row = rowsById.get(selected);
  const title = el("b", {}, `ID ${selected}`);
  // The note field stays in place across polls, so typing keeps focus; it is refilled only for another ID.
  const note = $("note");
  if (drawerFor !== selected) {
    note.value = notes[selected] ?? "";
    note.placeholder = `Note for ID ${selected} (browser only, in the export)`;
    drawerFor = selected;
  }
  note.hidden = !row;
  if (!row) {
    $("drawer-info").replaceChildren(
      el("div", { class: "row" },
        title, el("span", { class: "mute" }, "never seen"), el("span", { class: "grow" }),
        el("button", { "data-action": "close" }, "×")));
    return;
  }
  const head = el("div", { class: "row" },
    title,
    ...drawerBadges(row).map((badge) =>
      el("span", badge.colour === null ? { class: "badge" } : { class: "badge", style: `background:${badge.colour}` },
        badge.text)),
    el("span", { class: "grow" }),
    el("button", { "data-action": "mute", title: "A muted ID leaves the feed and experiments; its cell still updates" },
      mutes.has(selected) ? "Unmute" : "Mute"),
    el("button", { "data-action": "close" }, "×"),
  );
  const value = el("div", { class: "value" }, el("code", {}, shown(row.raw)));
  if (isPadded(row.raw)) {
    value.append(el("span", { class: "mute", title: `padded on the wire: "${row.raw}"` }, " ␣ padded"));
  }
  const fact = (label, ...value) => el("tr", {}, el("td", { class: "mute" }, label), el("td", {}, ...value));
  const facts = el("table", {},
    fact("Query status",
      el("span", { class: `s-${row.status}` }, row.status), row.statusAtMs === null ? "" : ` · ${formatWall(row.statusAtMs)}`),
    fact("Changes", String(row.changeCount)),
    fact("Last change", formatWall(row.changedAtMs)),
    fact("First / last seen", `${formatWall(row.firstSeenMs)} / ${formatWall(row.lastSeenMs)}`),
    fact("Command id", String(row.cmd ?? "—")),
  );
  const history = row.history.length === 0
    ? [el("div", { class: "mute" }, "no history")]
    : row.history.map((entry, i) =>
      el("div", {}, el("span", { class: "mute" }, formatWall(entry.atMs)), " ", el("code", {}, shown(entry.raw)),
        i === 0 ? el("span", { class: "mute" }, " ← current") : null));
  $("drawer-info").replaceChildren(head, value, facts, el("b", {}, "History"), ...history);
}

function render() {
  const rows = rowsOf(copy, notes);
  renderHeader();
  renderTabs();
  renderScan();
  if (goal === GOALS.check) {
    // Check has no map: changes seen meanwhile do not flash when discover opens again.
    flashIds.clear();
    renderCheck(rows);
    return;
  }
  const rowsById = new Map(rows.map((row) => [row.id, row]));
  const now = Date.now();
  const experiment = openExperiment();
  const analysis = experiment === null ? null : analyse(experiment);
  // No experiment open: no rings, and "only candidates" filters nothing.
  const statuses = new Map((analysis?.candidates ?? []).map((candidate) => [candidate.id, candidate.status]));
  const candidates = analysis === null ? null : new Set(statuses.keys());
  $("f-candidates").disabled = experiment === null;
  $("f-candidates").checked = filter.onlyCandidates && experiment !== null;
  const visible = visibleIds(CATALOGUE, rows, filter, now, candidates);
  $("known-gap-legend").textContent = `${showKnown ? "grey" : "blank"}: ${KNOWN_GAP_TEXT}`;
  $("f-types").classList.toggle("faded", colourBy !== "type");
  $("f-statuses").classList.toggle("faded", colourBy !== "status");
  renderExperimentTabs();
  renderGrid(rowsById, visible, statuses);
  renderCoach(experiment, analysis);
  if (experiment !== null) {
    renderCards(experiment, analysis, rowsById);
    renderTimeline(experiment);
  }
  renderFeed(feedIds(CATALOGUE, rows, filter, now));
  renderDrawer(rowsById);
}

/** Renders from a poll or at page open: a rendering bug is logged, not mistaken for the device being offline. */
function renderLogged() {
  try {
    render();
  } catch (error) {
    console.error("render failed", error);
  }
}

function download(name, text, type) {
  const link = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  // Safari can cancel a download from a detached link, or one whose URL is revoked right after the click.
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 0);
}

const exportOptions = () => ({
  mutes,
  includeMuted,
  experiments,
  openExperimentKey: openKey,
  onlyOpen: onlyOpen && openKey !== null,
  pendingProbe,
});

// ───── events ─────
function select(id) {
  selected = selected === id ? null : id;
  render();
}

$("grid").addEventListener("click", (event) => {
  const cell = event.target.closest(".cell[data-id]");
  if (cell) {
    select(Number(cell.dataset.id));
  }
});
$("feed").addEventListener("click", (event) => {
  const entry = event.target.closest("[data-id]");
  if (entry) {
    selected = Number(entry.dataset.id);
    render();
  }
});
$("drawer").addEventListener("click", (event) => {
  const action = event.target.dataset.action;
  if (action === "close") {
    selected = null;
  } else if (action === "mute") {
    if (mutes.has(selected)) {
      mutes.delete(selected);
    } else {
      mutes.add(selected);
    }
    save();
  } else {
    return;
  }
  render();
});
$("drawer").addEventListener("input", (event) => {
  if (event.target.id !== "note") {
    return;
  }
  const text = event.target.value;
  if (text) {
    notes[selected] = text;
  } else {
    delete notes[selected];
  }
  save();
  // The note field is not rebuilt by render, so it keeps focus; the ✎ marker and note search update now.
  render();
});
$("f-query").addEventListener("input", (event) => {
  filter.query = event.target.value;
  render();
});
$("f-candidates").addEventListener("change", (event) => {
  filter.onlyCandidates = event.target.checked;
  render();
});
$("f-changed").addEventListener("change", (event) => {
  filter.changedWithinMs = Number(event.target.value);
  render();
});
$("colour-by").addEventListener("change", (event) => {
  colourBy = event.target.value;
  render();
});
$("show-known").addEventListener("change", (event) => {
  showKnown = event.target.checked;
  render();
});
$("include-muted").addEventListener("change", (event) => {
  includeMuted = event.target.checked;
});
$("only-open").addEventListener("change", (event) => {
  onlyOpen = event.target.checked;
});
$("scan-toggle").addEventListener("click", toggleScan);
$("goal-tabs").addEventListener("click", (event) => {
  const tab = event.target.closest("[data-goal]");
  if (tab) {
    setGoal(tab.dataset.goal);
  }
});
$("exp-tabs").addEventListener("click", (event) => {
  const tab = event.target.closest("[data-experiment]");
  if (!tab) {
    return;
  }
  openKey = tab.dataset.experiment || null;
  forceFull = false;
  captureNote = null;
  render();
});
function startExperiment() {
  const name = $("experiment-name").value;
  if (mac === null || name.trim() === "") {
    return;
  }
  const experiment = newExperiment(name, Date.now(), experiments);
  experiments = [...experiments, experiment];
  openKey = experiment.key;
  $("experiment-name").value = "";
  save();
  render();
}
$("experiment-start").addEventListener("click", startExperiment);
$("experiment-name").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    startExperiment();
  }
});
$("capture").addEventListener("click", startCapture);
$("capture-label").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    startCapture();
  }
});
$("full-rescan").addEventListener("click", () => {
  forceFull = !forceFull;
  render();
});
// The range inputs change the next capture's full range while the experiment has none yet.
$("range").addEventListener("input", render);
$("experiment-view").addEventListener("click", (event) => {
  const target = event.target;
  const experiment = openExperiment();
  if (experiment === null) {
    return;
  }
  if (target.dataset.select !== undefined) {
    selected = Number(target.dataset.select);
    render();
  } else if (target.dataset.delete !== undefined) {
    updateExperiment(experiment.key, (stored) => withoutCapture(stored, Number(target.dataset.delete)));
    save();
    render();
  } else if (target.dataset.probe !== undefined) {
    const id = Number(target.dataset.probe);
    const { values } = probeChoices(CATALOGUE, experiment, id, copy.records[id]?.raw ?? null);
    const index = Number(target.closest(".card").querySelector("[data-probe-select]").value);
    if (values[index] !== undefined) {
      startProbe("probe", id, values[index]);
    }
  } else if (target.dataset.restore !== undefined) {
    const id = Number(target.dataset.restore);
    const original = restoreOffer(CATALOGUE, latestProbe(experiment, id));
    if (original !== null) {
      startProbe("restore", id, original);
    }
  }
});
$("experiment-view").addEventListener("change", (event) => {
  const selectBox = event.target.closest("[data-probe-select]");
  const experiment = openExperiment();
  if (!selectBox || experiment === null) {
    return;
  }
  const id = Number(selectBox.dataset.probeSelect);
  const { values } = probeChoices(CATALOGUE, experiment, id, copy.records[id]?.raw ?? null);
  probeSelections.set(id, values[Number(selectBox.value)]);
});
$("clear-data").addEventListener("click", clearData);
$("export-json").addEventListener("click", () =>
  download("sec_touch_sniffer.json", exportJson(CATALOGUE, copy, notes, exportOptions(), Date.now()),
    "application/json"));
$("export-csv").addEventListener("click", () =>
  download("sec_touch_sniffer.csv", exportCsv(CATALOGUE, copy, notes, exportOptions()), "text/csv"));

buildStatic();
renderTabs();
const storedMac = lastMac();
if (storedMac !== null) {
  // Shows (and exports) the stored copy even when the device is offline at page open.
  load(storedMac);
  renderLogged();
}
poller.start();
</script>
</body>
</html>
