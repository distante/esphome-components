; Host C++ unit tests only. Run with: pio test -e native
; Tested code is plain C++ from components/ with no ESPHome includes.
; Each suite is a folder tests/cpp/test_<name>/ (PlatformIO's convention).

[platformio]
test_dir = tests/cpp

[env:native]
platform = native
test_framework = googletest
; Same GoogleTest that ESPHome pins for its own C++ unit tests (esphome/platformio.ini).
lib_deps =
    google/googletest@^1.15.2
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    -I components
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
