# expect-error: value must be at most 255.

# The sniffer keeps one record slot per property ID 0..255, so it can't scan past 255.

esphome:
  name: sec-touch-sniffer-scan-end-256

esp32:
  board: esp32dev

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

text_sensor:
  - platform: sec_touch_sniffer
    sec_touch_id: sec_touch_component
    name: "Sniffer"
    scan_start: 1
    scan_end: 256
