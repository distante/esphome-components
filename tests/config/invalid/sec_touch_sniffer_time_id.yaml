# expect-error: time_id was removed: sniffer timestamps are device uptime, and the sniffer page shows wall time

# The sniffer used to take a time source for its timestamps. They are now device
# uptime, so time_id is a hard error. The wifi credentials are placeholders.

esphome:
  name: sec-touch-sniffer-time-id

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

wifi:
  ssid: "fixture"
  password: "fixture-password"

time:
  - platform: sntp
    id: sntp_time

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

text_sensor:
  - platform: sec_touch_sniffer
    sec_touch_id: sec_touch_component
    name: "Sniffer"
    time_id: sntp_time
    scan_start: 1
    scan_end: 250
    scan_switch:
      name: "Sniffer Scan Active"
