# expect-error: add `web_server_base:` (or `web_server:`)

# The sniffer page is served by web_server_base, which the sniffer does not auto-load.

esphome:
  name: sec-touch-sniffer-no-server

esp32:
  board: esp32dev

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

sec_touch_sniffer:
