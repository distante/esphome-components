# expect-error: Couldn't find any component that can be used for 'time::RealTimeClock'
# next_change needs a time source, and the config has no time: section.

esphome:
  name: tp-next-change-no-time

esp32:
  board: esp32dev

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  uart_id: sec_touch_uart
  time_programs:
    - fan_number: 1
      next_change:
        name: "Next change"

fan:
  - platform: sec_touch
    fan_number: 1
    name: "Kellerraum"
