# expect-error: switch time 2 is listed twice
# A switch time listed twice.

esphome:
  name: tp-switch-time-twice

esp32:
  board: esp32dev

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  uart_id: sec_touch_uart
  time_programs:
    - fan_number: 1
      switch_times: [2, 2]
