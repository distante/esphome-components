# The sniffer with web_page: true, which allocates the history pool. web_server_base
# serves the page once it lands. The wifi credentials are placeholders: the build never connects.

esphome:
  name: sec-touch-sniffer-web-page

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

wifi:
  ssid: "fixture"
  password: "fixture-password"

web_server_base:

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

text_sensor:
  - platform: sec_touch_sniffer
    sec_touch_id: sec_touch_component
    name: "Sniffer"
    scan_start: 1
    scan_end: 208
    web_page: true
