# A bare sec_touch_sniffer: block on web_server_base alone, without web_server: the /sniffer handler and the
# history pool. The wifi credentials are placeholders: the build never connects.

esphome:
  name: sec-touch-sniffer-server-base

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

wifi:
  ssid: "fixture"
  password: "fixture-password"

web_server_base:

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

sec_touch_sniffer:
