# The full sniffer example from components/sec_touch/readme.md: a time source
# for the timestamps, and an active scan with its switch. sntp stands in for
# homeassistant time. The wifi credentials are placeholders: the build never connects.

esphome:
  name: sec-touch-sniffer-with-time

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

wifi:
  ssid: "fixture"
  password: "fixture-password"

time:
  - platform: sntp
    id: sntp_time

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

text_sensor:
  - platform: sec_touch_sniffer
    sec_touch_id: sec_touch_component
    name: "Sniffer"
    time_id: sntp_time
    scan_start: 1
    scan_end: 250
    scan_switch:
      name: "Sniffer Scan Active"
