# The sniffer text sensor with its scan switch and no time: section, as in
# components/sec_touch/readme.md. time_id is optional, so the sniffer must
# build without the time component.

esphome:
  name: sec-touch-sniffer-without-time

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch, sec_touch_sniffer]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  id: sec_touch_component
  uart_id: sec_touch_uart

text_sensor:
  - platform: sec_touch_sniffer
    sec_touch_id: sec_touch_component
    name: "Sniffer"
    scan_start: 1
    scan_end: 250
    scan_switch:
      name: "Sniffer Scan Active"
