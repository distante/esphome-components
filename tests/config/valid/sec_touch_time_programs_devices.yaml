# The example package's sub-devices: each pair's entities carry the same names, told apart by their device. Pair 1's
# refresh button sits on pair 3's device, which has no entities of its own, so its name collides with nothing.

esphome:
  name: sec-touch-time-program-devices

packages:
  sec_touch_devices: !include ../../../components/sec_touch/examples/time-program-devices.yaml

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

sec_touch:
  uart_id: sec_touch_uart
  time_programs:
    - fan_number: 1
      device_id: sec_touch_pair_1_time_program
      refresh:
        name: "Refresh"
        device_id: sec_touch_pair_3_time_program
    - fan_number: 2
      device_id: sec_touch_pair_2_time_program
      refresh:
        name: "Refresh"
      write_failed:
        name: "Write failed"
