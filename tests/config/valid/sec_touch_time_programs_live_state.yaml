# Every live-state entity on pair 1, one on its own device. The wifi credentials are placeholders: the build never
# connects.

esphome:
  name: sec-touch-tp-live-state
  devices:
    - id: live_state_device
      name: "Kellerraum live state"
      relation: child

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

wifi:
  ssid: "fixture"
  password: "fixture-password"

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

time:
  - platform: sntp
    id: sntp_time

sec_touch:
  uart_id: sec_touch_uart
  time_programs:
    - fan_number: 1
      switch_times: [1]
      switch_time_in_effect:
        name: "Kellerraum switch time in effect"
      running_level:
        name: "Kellerraum running level"
      next_level:
        name: "Kellerraum next level"
        device_id: live_state_device
      next_change:
        name: "Kellerraum next change"

fan:
  - platform: sec_touch
    fan_number: 1
    name: "Kellerraum"
