# A quoted fan_number on the fan names the live state's pair. A quoted fan_number in time_programs gives pair 2 a
# live state for its entity although its fan opts out. The wifi credentials are placeholders: the build never
# connects.

esphome:
  name: sec-touch-tp-quoted-fan

esp32:
  board: esp32dev

logger:
  # Compiles every ESP_LOG* call, so the compile test sees -Wformat warnings.
  level: VERY_VERBOSE

wifi:
  ssid: "fixture"
  password: "fixture-password"

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sec_touch]

uart:
  id: sec_touch_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 28800

time:
  - platform: sntp
    id: sntp_time

sec_touch:
  uart_id: sec_touch_uart
  time_programs:
    - fan_number: 1
      switch_times: [1]
      switch_time_in_effect:
        name: "switch time in effect"
    - fan_number: "2"
      switch_times: [1]
      running_level:
        name: "running level"

fan:
  - platform: sec_touch
    fan_number: "1"
    name: "Kellerraum"
  - platform: sec_touch
    fan_number: 2
    name: "Bad"
    follow_time_program: false
